kind: element_type
id: Relay
title: Relay / smart switch
description_es: >
  Relé o interruptor inteligente (p.ej. Sonoff ZBMini). Alimentación LIn+N,
  salida conmutada LOut, entradas de interruptor externo S1/S2.
qet_hint: relay
terminals:
  N:
    label: N
    direction: in
    role: neutral
  LIn:
    label: L in
    direction: in
    role: phase
  LOut:
    label: L out
    direction: out
    role: phase
  S1:
    label: S1
    direction: in
    role: signal
  S2:
    label: S2
    direction: in
    role: signal
defaults:
  subtype: smart
subtypes:
  smart:
    title: Smart relay (Zigbee / Wi-Fi)
  zbmini_r2:
    title: Sonoff ZBMiniR2
    # Physical pins: N (pair tied internally), LOut, LIn, S1, S2.
  zbmini_extreme:
    title: Sonoff ZBMini Extreme (legacy alias)
  mini_zbd:
    title: Sonoff MINI Zigbee Dry (MINI-ZBD)
    # Power L+N; dry contact NO/COM/(NC). No switched mains LOut.
    terminals:
      L:
        label: L
        direction: in
        role: phase
      N:
        label: N
        direction: in
        role: neutral
      NO:
        label: NO
        direction: out
        role: signal
      COM:
        label: COM
        direction: inout
        role: signal
      NC:
        label: NC
        direction: out
        role: signal
