kind: element_type
id: Switch
title: Switch
description_es: >
  Interruptor de mecanismo (luz / carga). Subtypes: unipolar (1↔2),
  crossover / conmutador (C comun + bornes 1 y 2), intermediate (cruzamiento).
qet_hint: switch
terminals:
  "1":
    label: "1"
    direction: in
    role: phase
  "2":
    label: "2"
    direction: out
    role: phase
wireviz_collapse:
  - [1, 2]
defaults:
  subtype: unipolar
subtypes:
  unipolar:
    title: Single-pole (1-way)
  crossover:
    title: 3-way / conmutador
    # C = punto comun; 1 y 2 = bornes de conmutacion (travellers).
    terminals:
      C:
        label: C
        direction: inout
        role: phase
      "1":
        label: "1"
        direction: inout
        role: phase
      "2":
        label: "2"
        direction: inout
        role: phase
    wireviz_collapse: []
  intermediate:
    title: Intermediate / cruzamiento
    terminals:
      "1":
        label: "1"
        direction: inout
        role: phase
      "2":
        label: "2"
        direction: inout
        role: phase
      "3":
        label: "3"
        direction: inout
        role: phase
      "4":
        label: "4"
        direction: inout
        role: phase
    wireviz_collapse: []
