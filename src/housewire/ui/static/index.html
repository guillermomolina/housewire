<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HouseWire — physical</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem("housewire-theme");
        if (t !== "light" && t !== "dark") t = "dark";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    })();
  </script>
  <link rel="icon" href="/static/logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="/static/app.css?v=0.34.12" />
</head>
<body>
  <nav class="menubar" aria-label="Application">
    <a class="brand" href="/" title="HouseWire">
      <img class="brand-logo" src="/static/logo.svg" width="22" height="22" alt="" />
      <span class="brand-text">HouseWire</span>
    </a>
    <div class="menu" data-menu="file">
      <button type="button" class="menu-btn" id="menu-file-btn" aria-haspopup="true" aria-expanded="false">File</button>
      <div class="menu-dropdown hidden" id="menu-file" role="menu">
        <button type="button" role="menuitem" data-file-action="open">
          <span class="menu-item-main"><i class="fa-solid fa-folder-open" aria-hidden="true"></i><span>Open…</span></span>
          <span class="menu-shortcut">Ctrl+O</span>
        </button>
        <button type="button" role="menuitem" data-file-action="save" id="menu-save" disabled>
          <span class="menu-item-main"><i class="fa-solid fa-floppy-disk" aria-hidden="true"></i><span>Save</span></span>
          <span class="menu-shortcut">Ctrl+S</span>
        </button>
        <button type="button" role="menuitem" data-file-action="save-as" id="menu-save-as" disabled>
          <span class="menu-item-main"><i class="fa-solid fa-file-export" aria-hidden="true"></i><span>Save as…</span></span>
        </button>
        <button type="button" role="menuitem" data-file-action="close" id="menu-close" disabled>
          <span class="menu-item-main"><i class="fa-solid fa-xmark" aria-hidden="true"></i><span>Close</span></span>
        </button>
      </div>
    </div>
    <div class="menu" data-menu="edit">
      <button type="button" class="menu-btn" id="menu-edit-btn" aria-haspopup="true" aria-expanded="false">Edit</button>
      <div class="menu-dropdown hidden" id="menu-edit" role="menu">
        <button type="button" role="menuitem" data-edit-action="undo" id="menu-undo" disabled>
          <span class="menu-item-main"><i class="fa-solid fa-rotate-left" aria-hidden="true"></i><span>Undo</span></span>
          <span class="menu-shortcut">Ctrl+Z</span>
        </button>
        <button type="button" role="menuitem" data-edit-action="redo" id="menu-redo" disabled>
          <span class="menu-item-main"><i class="fa-solid fa-rotate-right" aria-hidden="true"></i><span>Redo</span></span>
          <span class="menu-shortcut">Ctrl+Y</span>
        </button>
        <button type="button" role="menuitem" data-edit-action="reset" id="menu-layout-reset" disabled>
          <span class="menu-item-main"><i class="fa-solid fa-clock-rotate-left" aria-hidden="true"></i><span>Reset</span></span>
        </button>
        <hr class="menu-sep" />
        <button type="button" role="menuitem" data-edit-action="auto-layout" id="menu-auto-layout">
          <span class="menu-item-main"><i class="fa-solid fa-table-cells-large" aria-hidden="true"></i><span>Auto-layout</span></span>
        </button>
        <hr class="menu-sep" />
        <div class="menu-item-submenu">
          <button
            type="button"
            class="menu-submenu-trigger"
            id="menu-insert-btn"
            aria-haspopup="true"
            aria-expanded="false"
            aria-controls="menu-insert"
          >
            <span class="menu-item-main"><i class="fa-solid fa-plus" aria-hidden="true"></i><span>Insert</span></span>
            <span class="menu-caret" aria-hidden="true"><i class="fa-solid fa-chevron-right"></i></span>
          </button>
          <div class="menu-flyout hidden" id="menu-insert" role="menu">
            <button type="button" role="menuitem" data-insert-action="socket">
              <span class="menu-item-main"><i class="fa-solid fa-plug" aria-hidden="true"></i><span>Socket…</span></span>
            </button>
            <button type="button" role="menuitem" data-insert-action="lamp">
              <span class="menu-item-main"><i class="fa-solid fa-lightbulb" aria-hidden="true"></i><span>Lamp…</span></span>
            </button>
            <button type="button" role="menuitem" data-insert-action="feed">
              <span class="menu-item-main"><i class="fa-solid fa-arrow-right-arrow-left" aria-hidden="true"></i><span>Feed…</span></span>
            </button>
            <hr class="menu-sep" />
            <button type="button" role="menuitem" data-insert-action="element" disabled title="Coming soon">
              <span class="menu-item-main"><i class="fa-solid fa-cube" aria-hidden="true"></i><span>Element…</span></span>
            </button>
            <button type="button" role="menuitem" data-insert-action="cable" disabled title="Coming soon">
              <span class="menu-item-main"><i class="fa-solid fa-link" aria-hidden="true"></i><span>Cable…</span></span>
            </button>
            <button type="button" role="menuitem" data-insert-action="conduit" disabled title="Coming soon">
              <span class="menu-item-main"><i class="fa-solid fa-grip-lines" aria-hidden="true"></i><span>Conduit…</span></span>
            </button>
          </div>
        </div>
      </div>
    </div>
    <div class="menu" data-menu="view">
      <button type="button" class="menu-btn" id="menu-view-btn" aria-haspopup="true" aria-expanded="false">View</button>
      <div class="menu-dropdown hidden" id="menu-view" role="menu">
        <button type="button" role="menuitemcheckbox" data-view-action="electrical" id="menu-electrical" aria-checked="false">
          <span class="menu-item-main"><i class="fa-solid fa-bolt" aria-hidden="true"></i><span>Electrical</span></span>
          <span class="menu-check" aria-hidden="true"><i class="fa-solid fa-check"></i></span>
        </button>
        <hr class="menu-sep" />
        <button type="button" role="menuitemradio" data-view-action="theme-dark" id="menu-theme-dark" aria-checked="true">
          <span class="menu-item-main"><i class="fa-solid fa-moon" aria-hidden="true"></i><span>Dark mode</span></span>
          <span class="menu-check" aria-hidden="true"><i class="fa-solid fa-check"></i></span>
        </button>
        <button type="button" role="menuitemradio" data-view-action="theme-light" id="menu-theme-light" aria-checked="false">
          <span class="menu-item-main"><i class="fa-solid fa-sun" aria-hidden="true"></i><span>Light mode</span></span>
          <span class="menu-check" aria-hidden="true"><i class="fa-solid fa-check"></i></span>
        </button>
        <hr class="menu-sep" />
        <button type="button" role="menuitem" data-view-action="zoom-in">
          <span class="menu-item-main"><i class="fa-solid fa-magnifying-glass-plus" aria-hidden="true"></i><span>Zoom in</span></span>
        </button>
        <button type="button" role="menuitem" data-view-action="zoom-out">
          <span class="menu-item-main"><i class="fa-solid fa-magnifying-glass-minus" aria-hidden="true"></i><span>Zoom out</span></span>
        </button>
        <button type="button" role="menuitem" data-view-action="fit">
          <span class="menu-item-main"><i class="fa-solid fa-expand" aria-hidden="true"></i><span>Fit</span></span>
        </button>
        <hr class="menu-sep" />
        <button type="button" role="menuitem" data-view-action="depth-in" id="menu-depth-in">
          <span class="menu-item-main"><i class="fa-solid fa-layer-group" aria-hidden="true"></i><span>Depth in</span></span>
        </button>
        <button type="button" role="menuitem" data-view-action="depth-out" id="menu-depth-out">
          <span class="menu-item-main"><i class="fa-solid fa-layer-group fa-flip-vertical" aria-hidden="true"></i><span>Depth out</span></span>
        </button>
      </div>
    </div>
    <div class="menu" data-menu="help">
      <button type="button" class="menu-btn" id="menu-help-btn" aria-haspopup="true" aria-expanded="false">Help</button>
      <div class="menu-dropdown hidden" id="menu-help" role="menu">
        <button type="button" role="menuitem" data-help-action="about">
          <span class="menu-item-main"><i class="fa-solid fa-circle-info" aria-hidden="true"></i><span>About</span></span>
        </button>
      </div>
    </div>
    <div id="doc-label" class="doc-label" title="Active site document"></div>
  </nav>
  <header class="toolbar" aria-label="Tools">
    <div class="tool-group" title="File">
      <button type="button" class="tool-btn" id="btn-open" title="Open (Ctrl+O)" aria-label="Open">
        <i class="fa-solid fa-folder-open" aria-hidden="true"></i>
      </button>
      <button type="button" class="tool-btn" id="btn-save" title="Save (Ctrl+S)" aria-label="Save" disabled>
        <i class="fa-solid fa-floppy-disk" aria-hidden="true"></i>
      </button>
    </div>
    <div class="tool-sep" aria-hidden="true"></div>
    <div class="tool-group" title="Edit">
      <button type="button" class="tool-btn" id="btn-undo" title="Undo (Ctrl+Z)" aria-label="Undo" disabled>
        <i class="fa-solid fa-rotate-left" aria-hidden="true"></i>
      </button>
      <button type="button" class="tool-btn" id="btn-redo" title="Redo (Ctrl+Y)" aria-label="Redo" disabled>
        <i class="fa-solid fa-rotate-right" aria-hidden="true"></i>
      </button>
      <button type="button" class="tool-btn" id="btn-layout-reset" title="Reset edits" aria-label="Reset edits" disabled>
        <i class="fa-solid fa-clock-rotate-left" aria-hidden="true"></i>
      </button>
      <button type="button" class="tool-btn" id="btn-auto-force" title="Auto-layout" aria-label="Auto-layout">
        <i class="fa-solid fa-table-cells-large" aria-hidden="true"></i>
      </button>
    </div>
    <div class="tool-sep" aria-hidden="true"></div>
    <div class="tool-group" title="View">
      <button type="button" class="tool-btn" id="btn-electrical" title="Electrical layer" aria-label="Electrical" aria-pressed="false">
        <i class="fa-solid fa-bolt" aria-hidden="true"></i>
      </button>
      <button type="button" class="tool-btn" id="btn-zoom-out" title="Zoom out" aria-label="Zoom out">
        <i class="fa-solid fa-magnifying-glass-minus" aria-hidden="true"></i>
      </button>
      <button type="button" class="tool-btn" id="btn-zoom-reset" title="Fit" aria-label="Fit">
        <i class="fa-solid fa-expand" aria-hidden="true"></i>
      </button>
      <button type="button" class="tool-btn" id="btn-zoom-in" title="Zoom in" aria-label="Zoom in">
        <i class="fa-solid fa-magnifying-glass-plus" aria-hidden="true"></i>
      </button>
      <button type="button" class="tool-btn" id="btn-depth-out" title="Depth out (Alt+wheel)" aria-label="Depth out">
        <i class="fa-solid fa-minus" aria-hidden="true"></i>
      </button>
      <span id="depth-label" class="depth-label" title="Depth">1/1</span>
      <button type="button" class="tool-btn" id="btn-depth-in" title="Depth in (Alt+wheel)" aria-label="Depth in">
        <i class="fa-solid fa-plus" aria-hidden="true"></i>
      </button>
    </div>
  </header>
  <div id="view-tabs" class="view-tabs" role="tablist" aria-label="Open files"></div>
  <div class="workspace">
    <aside id="nav-tree" class="nav-tree" aria-label="Site outline">
      <div class="panel-head">
        <h2>Outline</h2>
        <button type="button" class="panel-collapse" id="btn-collapse-outline" title="Collapse outline" aria-expanded="true" aria-controls="nav-tree">«</button>
      </div>
      <div id="outline-tree" class="outline-tree panel-body"></div>
    </aside>
    <button type="button" class="panel-expand left hidden" id="btn-expand-outline" title="Show outline" aria-controls="nav-tree">Outline</button>
    <main id="viewport">
      <svg id="canvas" xmlns="http://www.w3.org/2000/svg"></svg>
      <div id="marquee" class="marquee hidden" aria-hidden="true"></div>
    </main>
    <button type="button" class="panel-expand right hidden" id="btn-expand-inspector" title="Show properties" aria-controls="side-panel">Properties</button>
    <aside id="side-panel" class="side-panel">
      <div class="panel-head">
        <h2>Properties</h2>
        <button type="button" class="panel-collapse" id="btn-collapse-inspector" title="Collapse properties" aria-expanded="true" aria-controls="side-panel">»</button>
      </div>
      <div class="panel-body">
        <div id="panel-empty" class="panel-empty">Selecciona una caja o elemento</div>
        <div id="panel-props" class="panel-block hidden">
          <h3>Properties</h3>
          <dl id="props-meta" class="props-meta"></dl>
          <div id="props-elements-block">
            <h4>Elements</h4>
            <ul id="props-elements" class="props-list"></ul>
          </div>
          <div id="props-conduits-block">
            <h4>Conduits</h4>
            <ul id="props-conduits" class="props-list"></ul>
          </div>
          <div id="props-cables-block" class="hidden">
            <h4>Cables</h4>
            <ul id="props-cables" class="props-list"></ul>
          </div>
        </div>
      </div>
    </aside>
  </div>
  <footer class="statusbar">
    <div id="status" class="statusbar-msg" aria-live="polite"></div>
    <div class="statusbar-zoom" title="Canvas zoom">
      <button type="button" class="statusbar-zoom-btn" id="status-zoom-out" aria-label="Zoom out">
        <i class="fa-solid fa-magnifying-glass-minus" aria-hidden="true"></i>
      </button>
      <input
        type="range"
        id="zoom-slider"
        min="5"
        max="300"
        step="1"
        value="100"
        aria-label="Zoom"
      />
      <button type="button" class="statusbar-zoom-btn" id="status-zoom-in" aria-label="Zoom in">
        <i class="fa-solid fa-magnifying-glass-plus" aria-hidden="true"></i>
      </button>
      <span id="zoom-label" class="zoom-label">100%</span>
    </div>
  </footer>
  <div id="app-modal" class="modal hidden" aria-hidden="true">
    <div class="modal-backdrop" data-modal-dismiss></div>
    <div class="modal-card" role="alertdialog" aria-modal="true" aria-labelledby="app-modal-title" aria-describedby="app-modal-message">
      <h2 id="app-modal-title">Confirm</h2>
      <p id="app-modal-message" class="modal-hint"></p>
      <label id="app-modal-input-wrap" class="modal-field hidden">
        <span id="app-modal-input-label">Path</span>
        <input id="app-modal-input" type="text" autocomplete="off" spellcheck="false" />
      </label>
      <div class="modal-actions" id="app-modal-actions"></div>
    </div>
  </div>
  <div id="insert-modal" class="modal hidden" aria-hidden="true">
    <div class="modal-backdrop" data-insert-dismiss></div>
    <div
      class="modal-card modal-card-form"
      role="dialog"
      aria-modal="true"
      aria-labelledby="insert-modal-title"
    >
      <div class="modal-card-head">
        <h2 id="insert-modal-title">Insert</h2>
        <button type="button" class="modal-close" data-insert-dismiss aria-label="Close">
          <i class="fa-solid fa-xmark" aria-hidden="true"></i>
        </button>
      </div>
      <div class="modal-card-body">
        <form id="form-socket" class="insert-form">
          <label>Name <input name="name" required placeholder="Enchufe_5" /></label>
          <label>From <input name="from" required placeholder="Caja.N1" /></label>
          <label>Strip <input name="strip" value="Regleta" required /></label>
          <label>Pins <input name="pins" placeholder="3,2,1" /></label>
          <div class="insert-form-actions">
            <button type="button" data-insert-dismiss>Cancel</button>
            <button type="submit" class="primary">Add socket</button>
          </div>
        </form>
        <form id="form-lamp" class="insert-form hidden">
          <label>Name <input name="name" required placeholder="Lampara_3" /></label>
          <label>From <input name="from" required placeholder="Caja.S1" /></label>
          <label>Strip <input name="strip" value="Regleta" required /></label>
          <label>Pins <input name="pins" required placeholder="6,5,2" /></label>
          <label>To pins <input name="to_pins" placeholder="1,2,3" /></label>
          <div class="insert-form-actions">
            <button type="button" data-insert-dismiss>Cancel</button>
            <button type="submit" class="primary">Add lamp</button>
          </div>
        </form>
        <form id="form-feed" class="insert-form hidden">
          <label>Name <input name="name" required placeholder="Linea_A_a_B" /></label>
          <label>From <input name="from" required placeholder="Caja_A.E1" /></label>
          <label>To <input name="to" required placeholder="Caja_B.N1" /></label>
          <label>From pin <input name="from_pin" required placeholder="Regleta.1" /></label>
          <label>To pin <input name="to_pin" required placeholder="Regleta.1" /></label>
          <div class="insert-form-actions">
            <button type="button" data-insert-dismiss>Cancel</button>
            <button type="submit" class="primary">Add feed</button>
          </div>
        </form>
        <p id="insert-msg" class="insert-msg"></p>
      </div>
    </div>
  </div>
  <div id="about-modal" class="modal hidden" aria-hidden="true">
    <div class="modal-backdrop" data-about-dismiss></div>
    <div
      class="modal-card modal-card-about"
      role="dialog"
      aria-modal="true"
      aria-labelledby="about-modal-title"
    >
      <div class="modal-card-head">
        <h2 id="about-modal-title">About</h2>
        <button type="button" class="modal-close" data-about-dismiss aria-label="Close">
          <i class="fa-solid fa-xmark" aria-hidden="true"></i>
        </button>
      </div>
      <div class="modal-card-body about-body">
        <div class="about-brand">
          <img class="about-logo" src="/static/logo.svg" width="56" height="56" alt="" />
          <div>
            <div class="about-title" id="about-title">HouseWire</div>
            <div class="about-version" id="about-version"></div>
          </div>
        </div>
        <p class="about-description" id="about-description"></p>
        <dl class="about-meta">
          <div>
            <dt>Author</dt>
            <dd id="about-author"></dd>
          </div>
          <div>
            <dt>Repository</dt>
            <dd><a id="about-repository" href="#" target="_blank" rel="noopener noreferrer"></a></dd>
          </div>
          <div>
            <dt>License</dt>
            <dd id="about-license"></dd>
          </div>
          <div>
            <dt>Copyright</dt>
            <dd id="about-copyright"></dd>
          </div>
        </dl>
        <div class="modal-actions">
          <button type="button" class="primary" data-about-dismiss>Close</button>
        </div>
      </div>
    </div>
  </div>
  <input type="file" id="file-open-input" accept=".yaml,.yml,text/yaml,application/x-yaml" hidden />
  <script src="/static/app.js?v=0.34.12"></script>
</body>
</html>
