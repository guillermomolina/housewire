kind: place_type
id: DeviceBox
icon: fa-box
label: Device / mechanism box
description: >
  Mechanism box (socket, switch, …). Usually 1-gang; 2-gang / 3-gang group
  several devices in the same box. Declare mouths in openings (local ids N1,
  B1-1, …). Socket/Switch instances go under elements.
  Place type: no electrical terminals.
terminals: {}
defaults:
  subtype: 1-gang
