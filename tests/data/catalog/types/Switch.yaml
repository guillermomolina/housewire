kind: element_type
id: Switch
icon: fa-toggle-on
title: Switch
description_es: >
  Interruptor de mecanismo (luz / carga). Subtypes: unipolar (N1↔S1),
  crossover / conmutador (N1 comun + N2/N3), intermediate (cruzamiento).
qet_hint: switch
terminal_grid:
  NS: 1
terminals:
  N1:
    label: "1"
    direction: in
    role: phase
  S1:
    label: "2"
    direction: out
    role: phase
defaults:
  subtype: unipolar
subtypes:
  unipolar:
    title: Single-pole (1-way)
  crossover:
    title: 3-way / conmutador
    # N1 = punto comun; N2 y N3 = bornes de conmutacion (travellers).
    terminal_grid:
      NS: 3
    terminals:
      N1:
        label: C
        direction: inout
        role: phase
      N2:
        label: "1"
        direction: inout
        role: phase
      N3:
        label: "2"
        direction: inout
        role: phase
  intermediate:
    title: Intermediate / cruzamiento
    terminal_grid:
      NS: 2
    terminals:
      N1:
        label: "1"
        direction: inout
        role: phase
      S1:
        label: "2"
        direction: inout
        role: phase
      N2:
        label: "3"
        direction: inout
        role: phase
      S2:
        label: "4"
        direction: inout
        role: phase
