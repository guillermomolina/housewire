kind: element_type
id: Switch
icon: fa-toggle-on
label: Switch
description: >
  Mechanism switch (light / load). Subtypes: unipolar (N1↔S1), crossover /
  3-way (N1 common + N2/N3), intermediate (4-way).
qet_hint: switch
terminal_grid:
  NS: 1
terminals:
  N1:
    label: "1"
    direction: in
    role: phase
  S1:
    label: "2"
    direction: out
    role: phase
defaults:
  subtype: unipolar
subtypes:
  unipolar:
    label: Single-pole (1-way)
  crossover:
    label: 3-way
    # N1 = common; N2 and N3 = travellers.
    terminal_grid:
      NS: 3
    terminals:
      N1:
        label: C
        direction: inout
        role: phase
      N2:
        label: "1"
        direction: inout
        role: phase
      N3:
        label: "2"
        direction: inout
        role: phase
  intermediate:
    label: Intermediate / 4-way
    terminal_grid:
      NS: 2
    terminals:
      N1:
        label: "1"
        direction: inout
        role: phase
      S1:
        label: "2"
        direction: inout
        role: phase
      N2:
        label: "3"
        direction: inout
        role: phase
      S2:
        label: "4"
        direction: inout
        role: phase
