kind: element_type
id: TerminalStrip
icon: fa-grip-lines
label: Terminal strip / connector block
description_es: >
  Regleta o bornes de empalme en caja de derivacion.
  Ids face-cell solo en N (N1..Nn); terminal_grid NS dibuja ambos lados del
  mismo potencial. Ampliar en la instancia p.ej. terminal_grid: { NS: 6 }
  y terminals N1..N6.
qet_hint: terminal_strip
terminal_grid:
  NS: 3
terminals:
  N1:
    label: "1"
    direction: inout
  N2:
    label: "2"
    direction: inout
  N3:
    label: "3"
    direction: inout
