kind: element_type
id: TerminalStrip
icon: fa-grip-lines
title: Terminal strip / connector block
description_es: >
  Regleta o bornes de empalme en caja de derivacion.
  Cada posicion une los conductores del mismo potencial.
  Ampliar bornes en la instancia si la regleta tiene mas de 3 (p.ej. 6 pares)
  con ``terminal_grid: { NS: 6 }`` y terminals 1..6.
qet_hint: terminal_strip
terminal_grid:
  NS: 3
terminals:
  "1":
    label: "1"
    direction: inout
  "2":
    label: "2"
    direction: inout
  "3":
    label: "3"
    direction: inout
