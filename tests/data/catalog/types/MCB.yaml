kind: element_type
id: MCB
icon: fa-bolt
label: Miniature circuit breaker
description: >
  Miniature circuit breaker (MCB / PIA). Protects against overload and short
  circuit. Not an RCD (residual current device).
qet_hint: mcb_1P_N
# Face-cell ids: N1/S1 phase, N2/S2 neutral. label = casing mark.
terminal_grid:
  NS: 2
terminals:
  N1:
    label: "1"
    direction: in
    role: phase
  S1:
    label: "2"
    direction: out
    role: phase
  N2:
    label: N
    direction: in
    role: neutral
  S2:
    label: N
    direction: out
    role: neutral
