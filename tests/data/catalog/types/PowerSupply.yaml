kind: element_type
id: PowerSupply
icon: fa-battery-full
title: AC/DC power supply
description_es: Fuente / transformador (p.ej. portero). Primario AC, secundario DC.
qet_hint: power_supply_ac_dc
# terminal_pairs: one visual column per pair (not AC↔DC continuity).
terminal_pairs:
  - [L, "+"]
  - [N, "-"]
terminal_grid:
  NS: 2
terminals:
  L:
    label: "230V AC L"
    direction: in
    role: phase
  N:
    label: "230V AC N"
    direction: in
    role: neutral
  "+":
    label: "12V DC +"
    direction: out
    role: dc_positive
  "-":
    label: "12V DC -"
    direction: out
    role: dc_negative
