[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "housewire"
version = "0.50.0"
description = "Document home electrical installations (house/v2) with an interactive UI and shell"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "SSPL-1.0" }
authors = [{ name = "Guillermo Adrián Molina" }]
keywords = ["electrical", "wiring", "house", "diagram"]
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
catalog = [
    "housewire-catalog @ git+https://github.com/guillermomolina/housewire-catalog.git",
]
dev = [
    "build",
    "wheel",
    "pytest>=8.0",
    "pytest-xdist>=3.5",
    "httpx2>=2.0",
    "playwright>=1.40",
    "housewire-catalog @ git+https://github.com/guillermomolina/housewire-catalog.git",
]
ui = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
examples = [
    "housewire-examples",
    "housewire-catalog @ git+https://github.com/guillermomolina/housewire-catalog.git",
]

[project.scripts]
housewire = "housewire.cli:main"

[project.urls]
Homepage = "https://github.com/guillermomolina/housewire"
Repository = "https://github.com/guillermomolina/housewire"
Issues = "https://github.com/guillermomolina/housewire/issues"
Changelog = "https://github.com/guillermomolina/housewire/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
housewire = ["ui/static/*"]

[tool.pytest.ini_options]
markers = [
    "route_e2e: live Playwright route canvas checks (parallel-safe, heavy)",
]
# Cap workers for Chromium+serve memory; override with -n N.
addopts = []
