schema: house/v2
type: House
label: 'Route 03 — twin conductors'
notes: 'Two boxes, one conduit carrying BN+BU.'
elements:
  Box_A:
    type: DeviceBox
    label: Box A
    openings: [E1]
    opening_grid: {E: 1}
    elements:
      Socket:
        type: Socket
        label: Socket
        view:
          electrical: {x: 40.0, y: 30.0}
    cables: {}
    view:
      physical: {x: 40.0, y: 80.0}
  Box_B:
    type: DeviceBox
    label: Box B
    openings: [W1]
    opening_grid: {W: 1}
    elements:
      Socket:
        type: Socket
        label: Socket
        view:
          electrical: {x: 40.0, y: 30.0}
    cables: {}
    view:
      physical: {x: 340.0, y: 80.0}
cables:
  L:
    type: Conductor
    section: 1.5 mm2
    color: BN
    from: Box_A/Socket.N1
    to: Box_B/Socket.N1
  N:
    type: Conductor
    section: 1.5 mm2
    color: BU
    from: Box_A/Socket.N3
    to: Box_B/Socket.N3
  Cable:
    type: Cable
    contains: [L, N]
    color: BK
    section: 1.5 mm2
  Tube:
    type: Conduit
    subtype: tube
    from: Box_A.E1
    to: Box_B.W1
    contains: [Cable]
    color: BK

view:
  physical:
    x: 0.0
    y: 0.0
    page:
      width: 640
      height: 480
