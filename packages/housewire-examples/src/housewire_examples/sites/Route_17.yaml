schema: house/v2
type: House
label: 'Route 17 — NESW fan'
notes: 'Two parallel east tubes (fan-out stand-in until empty tubes are fixed).'
elements:
  Box_A:
    type: JunctionBox
    label: Hub
    openings: [E1, E2]
    opening_grid: {E: 2}
    elements:
      Strip:
        type: TerminalStrip
        terminal_grid: {NS: 2}
        terminals:
          N1: {label: '1', direction: InOut, role: Phase}
          N2: {label: '2', direction: InOut, role: Phase}
        view:
          electrical: {x: 70.0, y: 60.0}
    cables: {}
    view:
      physical: {x: 40.0, y: 100.0}
  Box_B:
    type: DeviceBox
    label: North-east
    openings: [W1]
    opening_grid: {W: 1}
    elements:
      Socket:
        type: Socket
        view:
          electrical: {x: 40.0, y: 30.0}
    cables: {}
    view:
      physical: {x: 360.0, y: 40.0}
  Box_C:
    type: DeviceBox
    label: South-east
    openings: [W1]
    opening_grid: {W: 1}
    elements:
      Socket:
        type: Socket
        view:
          electrical: {x: 40.0, y: 30.0}
    cables: {}
    view:
      physical: {x: 360.0, y: 220.0}
cables:
  Run_B:
    type: Conductor
    section: 1.5 mm2
    color: BN
    from: Box_A/Strip.N1
    to: Box_B/Socket.N1
  Run_C:
    type: Conductor
    section: 1.5 mm2
    color: BK
    from: Box_A/Strip.N2
    to: Box_C/Socket.N1
  Tube_B:
    type: Conduit
    subtype: Tube
    from: Box_A.E1
    to: Box_B.W1
    contains: [Run_B]
  Tube_C:
    type: Conduit
    subtype: Tube
    from: Box_A.E2
    to: Box_C.W1
    contains: [Run_C]

view:
  physical:
    x: 0.0
    y: 0.0
    page:
      width: 640
      height: 480
