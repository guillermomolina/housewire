schema: house/v2
type: House
label: 'Route 19 — staggered heights'
notes: 'Vertical stagger of three device boxes from one hub.'
elements:
  Hub:
    type: JunctionBox
    label: Hub
    openings: [E1]
    opening_grid: {E: 1}
    elements:
      Strip:
        type: TerminalStrip
        terminal_grid: {NS: 3}
        terminals:
          N1: {label: '1', direction: InOut, role: Phase}
          N2: {label: '2', direction: InOut, role: Phase}
          N3: {label: '3', direction: InOut, role: Phase}
        view:
          electrical: {x: 60.0, y: 70.0}
    cables: {}
    view:
      physical: {x: 40.0, y: 140.0}
  Top:
    type: DeviceBox
    label: Top
    openings: [W1]
    opening_grid: {W: 1}
    elements:
      Socket:
        type: Socket
        view:
          electrical: {x: 40.0, y: 30.0}
    cables: {}
    view:
      physical: {x: 360.0, y: 40.0}
  Mid:
    type: DeviceBox
    label: Mid
    openings: [W1]
    opening_grid: {W: 1}
    elements:
      Socket:
        type: Socket
        view:
          electrical: {x: 40.0, y: 30.0}
    cables: {}
    view:
      physical: {x: 360.0, y: 160.0}
  Bot:
    type: DeviceBox
    label: Bot
    openings: [W1]
    opening_grid: {W: 1}
    elements:
      Socket:
        type: Socket
        view:
          electrical: {x: 40.0, y: 30.0}
    cables: {}
    view:
      physical: {x: 360.0, y: 280.0}
cables:
  C1:
    type: Conductor
    section: 1.5 mm2
    color: BN
    from: Hub/Strip.N1
    to: Top/Socket.N1
  C2:
    type: Conductor
    section: 1.5 mm2
    color: BK
    from: Hub/Strip.N2
    to: Mid/Socket.N1
  C3:
    type: Conductor
    section: 1.5 mm2
    color: BU
    from: Hub/Strip.N3
    to: Bot/Socket.N1
  T1:
    type: Conduit
    subtype: Tube
    from: Hub.E1
    to: Top.W1
    contains: [C1]
  T2:
    type: Conduit
    subtype: Tube
    from: Hub.E1
    to: Mid.W1
    contains: [C2]
  T3:
    type: Conduit
    subtype: Tube
    from: Hub.E1
    to: Bot.W1
    contains: [C3]

view:
  physical:
    x: 0.0
    y: 0.0
    page:
      width: 640
      height: 480
