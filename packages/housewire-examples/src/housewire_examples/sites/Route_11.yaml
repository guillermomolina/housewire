schema: house/v2
type: House
label: 'Route 11 — two parallel tubes'
notes: 'Two independent conduits side by side.'
elements:
  Box_A:
    type: JunctionBox
    label: A
    openings: [E1, E2]
    opening_grid: {E: 2}
    elements:
      Strip:
        type: TerminalStrip
        terminal_grid: {NS: 2}
        terminals:
          N1: {label: '1', direction: inout, role: phase}
          N2: {label: '2', direction: inout, role: phase}
        view:
          electrical: {x: 60.0, y: 50.0}
    cables: {}
    view:
      physical: {x: 40.0, y: 60.0}
  Box_B:
    type: DeviceBox
    label: B1
    openings: [W1]
    opening_grid: {W: 1}
    elements:
      Socket:
        type: Socket
        view:
          electrical: {x: 40.0, y: 30.0}
    cables: {}
    view:
      physical: {x: 360.0, y: 40.0}
  Box_C:
    type: DeviceBox
    label: B2
    openings: [W1]
    opening_grid: {W: 1}
    elements:
      Socket:
        type: Socket
        view:
          electrical: {x: 40.0, y: 30.0}
    cables: {}
    view:
      physical: {x: 360.0, y: 180.0}
cables:
  R1:
    type: Conductor
    section: 1.5 mm2
    color: BN
    from: Box_A/Strip.N1
    to: Box_B/Socket.N1
  R2:
    type: Conductor
    section: 1.5 mm2
    color: BK
    from: Box_A/Strip.N2
    to: Box_C/Socket.N1
  T1:
    type: Conduit
    subtype: tube
    from: Box_A.E1
    to: Box_B.W1
    contains: [R1]
  T2:
    type: Conduit
    subtype: tube
    from: Box_A.E2
    to: Box_C.W1
    contains: [R2]

view:
  physical:
    x: 0.0
    y: 0.0
    page:
      width: 640
      height: 480
