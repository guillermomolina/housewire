schema: house/v2
type: House
label: Route 04 — L shaped path
notes: 'Three boxes: horizontal then vertical conduit chain.'
elements:
  Box_A:
    type: DeviceBox
    label: A
    openings:
    - E1
    opening_grid:
      E: 1
    elements:
      Socket:
        type: Socket
        view:
          electrical:
            x: 40.0
            y: 30.0
    cables: {}
    view:
      physical:
        x: 0.0
        y: 20.0
        bounds: sprite
  Box_B:
    type: JunctionBox
    label: Bend
    openings:
    - W1
    - S1
    opening_grid:
      WE: 1
      NS: 1
    elements:
      Strip:
        type: TerminalStrip
        terminal_grid:
          NS: 2
        terminals:
          N1:
            label: '1'
            direction: InOut
            role: Phase
          N2:
            label: '2'
            direction: InOut
            role: Neutral
        view:
          electrical:
            x: 60.0
            y: 50.0
    cables: {}
    view:
      physical:
        x: 260.0
        y: 20.0
        bounds: sprite
  Box_C:
    type: DeviceBox
    label: C
    openings:
    - N1
    opening_grid:
      N: 1
    elements:
      Socket:
        type: Socket
        view:
          electrical:
            x: 40.0
            y: 30.0
    cables: {}
    view:
      physical:
        x: 260.0
        y: 260.0
        bounds: sprite
cables:
  AB:
    type: Conductor
    section: 1.5 mm2
    color: BN
    from: Box_A/Socket.N1
    to: Box_B/Strip.N1
  BC:
    type: Conductor
    section: 1.5 mm2
    color: BN
    from: Box_B/Strip.N1
    to: Box_C/Socket.N1
  Tube_AB:
    type: Conduit
    subtype: Tube
    from: Box_A.E1
    to: Box_B.W1
    contains:
    - AB
  Tube_BC:
    type: Conduit
    subtype: Tube
    from: Box_B.S1
    to: Box_C.N1
    contains:
    - BC
view:
  physical:
    x: 0.0
    y: 0.0
    page:
      width: 640
      height: 480
