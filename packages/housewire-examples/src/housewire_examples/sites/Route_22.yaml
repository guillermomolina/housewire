        terminals:
          E1: {label: '2', direction: out, role: phase}
          W1: {label: '1', direction: in, role: phase}
        view:
          electrical: {x: 20.0, y: 80.0}
      Mid_A:
        type: MCB
        label: Mid A
        view:
          electrical: {x: 120.0, y: 80.0}
      Mid_B:
        type: MCB
        label: Mid B
        view:
          electrical: {x: 220.0, y: 80.0}
      Right:
        type: MCB
        label: Right
        terminal_grid: {WE: 1}
        terminals:
          E1: {label: '2', direction: out, role: phase}
          W1: {label: '1', direction: in, role: phase}
        view:
          electrical: {x: 320.0, y: 80.0}
    cables:
      Link:
        type: Conductor
        section: 1.5 mm2
        color: BN
        from: Left.E1
        to: Right.W1
    view:
      physical: {x: 40.0, y: 40.0, w: 520.0, h: 280.0}

