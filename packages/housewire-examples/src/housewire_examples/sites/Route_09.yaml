schema: house/v2
type: House
label: 'Route 09 — strip four pairs feed'
notes: 'Panel feed to 4-pair strip (phase, switched, neutral, PE).'
elements:
  Panel:
    type: Panel
    label: Panel
    openings: [S1]
    opening_grid: {S: 1}
    elements:
      Supply:
        type: Supply
        view:
          electrical: {x: 40.0, y: 20.0}
      Earth:
        type: EarthElectrode
        view:
          electrical: {x: 180.0, y: 20.0}
    cables: {}
    view:
      physical: {x: 140.0, y: 10.0}
  Box:
    type: JunctionBox
    label: Box
    openings: [N1, E1]
    opening_grid: {NS: 1, WE: 1}
    elements:
      Strip:
        type: TerminalStrip
        terminal_grid: {NS: 4}
        terminals:
          N1: {label: L, direction: inout, role: phase}
          N2: {label: Lsw, direction: inout, role: phase}
          N3: {label: N, direction: inout, role: neutral}
          N4: {label: PE, direction: inout, role: pe}
        view:
          electrical: {x: 70.0, y: 80.0}
    cables: {}
    view:
      physical: {x: 140.0, y: 220.0}
cables:
  L:
    type: Conductor
    section: 2.5 mm2
    color: BN
    from: Panel/Supply.S1
    to: Box/Strip.N1
  N:
    type: Conductor
    section: 2.5 mm2
    color: BU
    from: Panel/Supply.S2
    to: Box/Strip.N3
  PE:
    type: Conductor
    section: 2.5 mm2
    color: GNYE
    from: Panel/Earth.S1
    to: Box/Strip.N4
  Power:
    type: Cable
    contains: [L, N]
    color: BK
    section: 2.5 mm2
  EarthCable:
    type: Cable
    contains: [PE]
    color: BK
    section: 2.5 mm2
  Tube:
    type: Conduit
    subtype: tube
    from: Panel.S1
    to: Box.N1
    contains: [Power, EarthCable]

view:
  physical:
    x: 0.0
    y: 0.0
    page:
      width: 640
      height: 480
