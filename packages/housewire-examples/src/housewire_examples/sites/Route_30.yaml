name: Route_30
label: Route 30 — nine conductors in one aligned S↔N conduit
notes: 'Two large, X-aligned DeviceBoxes with a clear vertical gap; facing openings
  (upper S1 ↔ lower N1) leave a straight tube. Nine BN conductors ride one Tube. With
  Electrical on: the conduit must be a single segment, and each mouth↔terminal-strip
  inbox must use at most three Manhattan segments.

  '
